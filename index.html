<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습 데이터 분석 및 관리</title>
<style>
/* ============================================================
   색과 글꼴 기본값
   차트 색은 색약(색맹) 검사를 통과한 조합만 사용했습니다.
   - 한 종류 막대: 파랑 한 색
   - 두 계열 비교(학생 vs 학급): 파랑 + 주황
   - 성취수준 A~E: 진한 파랑 → 옅은 파랑 → 주황 → 빨강 (좋음→도움 필요)
     (색만으로 구분하지 않도록 숫자 라벨과 범례를 항상 함께 표시합니다)
   ============================================================ */
:root {
  --navy-900: #0f2a52;
  --navy-800: #143566;
  --navy-700: #1a4380;

  --blue-700: #1c5cab;
  --blue-600: #256abf;
  --blue-500: #2a78d6;
  --blue-400: #3987e5;
  --blue-200: #9ec5f4;
  --blue-100: #d8e8fc;
  --blue-050: #f1f6fe;

  --page:     #f4f6fa;
  --surface:  #ffffff;
  --ink:      #16233a;
  --ink-2:    #4a5568;
  --muted:    #8a94a6;
  --line:     #e3e9f2;
  --grid:     #eef2f8;

  /* 상태 색 (배지·강조에만 사용, 항상 글자와 함께) */
  --good:     #0ca30c;
  --good-bg:  #e8f7e8;
  --warn:     #b07d00;
  --warn-bg:  #fdf3d8;
  --serious:  #c0561f;
  --serious-bg:#fdeade;
  --critical: #c22f2f;
  --critical-bg:#fdeaea;

  /* 차트 색 */
  --c-bar:    #2a78d6;
  --c-me:     #2a78d6;
  --c-class:  #eb6834;
  --lv-A:     #0d366b;
  --lv-B:     #2a78d6;
  --lv-C:     #7fb4f5;
  --lv-D:     #ec835a;
  --lv-E:     #d03b3b;

  --shadow-1: 0 1px 2px rgba(22,35,58,.06), 0 4px 14px rgba(22,35,58,.06);
  --shadow-2: 0 2px 6px rgba(22,35,58,.08), 0 12px 28px rgba(22,35,58,.10);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "맑은 고딕", "Malgun Gothic", "Apple SD Gothic Neo",
               "나눔고딕", "NanumGothic", "Noto Sans KR", "돋움", Dotum, sans-serif;
  color: var(--ink);
  background: var(--page);
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.55;
}

button, select, input { font-family: inherit; }

/* ===== 전체 골격 : 왼쪽 사이드바 + 오른쪽 본문 ===== */
.app { display: flex; min-height: 100vh; }

.sidebar {
  /* 본문을 스크롤해도 왼쪽 메뉴는 제자리에 머무릅니다 */
  position: sticky;
  top: 0;
  align-self: flex-start;
  height: 100vh;
  z-index: 30;
  flex: 0 0 240px;
  background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
  color: #ffffff;
  padding: 26px 16px 22px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  overflow-y: auto;
}

.brand { padding: 0 8px; }
.brand .logo { font-size: 26px; line-height: 1; }
.brand .title {
  margin-top: 10px;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.35;
}
.brand .sub { margin-top: 4px; font-size: 12.5px; color: rgba(255,255,255,.62); }

.side-label {
  padding: 0 8px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .08em;
  color: rgba(255,255,255,.45);
}

#menuWrap { display: flex; flex-direction: column; gap: 16px; }
.menu { display: flex; flex-direction: column; gap: 4px; }
.side-label + .menu { margin-top: 6px; }

.menu button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 14px;
  font-size: 15px;
  font-weight: 600;
  color: rgba(255,255,255,.78);
  text-align: left;
  background: transparent;
  border: none;
  border-radius: 11px;
  cursor: pointer;
  transition: background-color .15s ease, color .15s ease;
}
.menu button .ico { font-size: 16px; width: 20px; text-align: center; }
.menu button .tag:empty { display: none; }
.menu button .tag {
  margin-left: auto;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(255,255,255,.14);
  color: rgba(255,255,255,.72);
}
.menu button:hover { background: rgba(255,255,255,.09); color: #fff; }
.menu button.active {
  background: rgba(255,255,255,.16);
  color: #ffffff;
  box-shadow: inset 3px 0 0 var(--blue-400);
}
.menu button:focus-visible { outline: 2px solid #9ec5f4; outline-offset: 1px; }

.side-foot {
  margin-top: auto;
  padding: 12px 12px 0;
  font-size: 12px;
  line-height: 1.6;
  color: rgba(255,255,255,.55);
  border-top: 1px solid rgba(255,255,255,.12);
}

/* ===== 본문 ===== */
.main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  padding: 18px 30px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 10px rgba(22,35,58,.05);
}
.topbar h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.topbar .page-sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.topbar .spacer { flex: 1 1 auto; }
.topbar .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

/* 학급 전체 / 개인별 토글 */
.segmented {
  display: inline-flex;
  padding: 3px;
  background: var(--page);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.segmented button {
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
  background: transparent;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  transition: background-color .15s ease, color .15s ease, box-shadow .15s ease;
}
.segmented button.active {
  color: var(--blue-700);
  background: var(--surface);
  box-shadow: var(--shadow-1);
}
.segmented button:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 1px; }

select {
  font-size: 14px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 9px 12px;
  cursor: pointer;
  box-shadow: var(--shadow-1);
}
select:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 1px; }
select[hidden] { display: none; }

.content { padding: 26px 30px 60px; max-width: 1180px; width: 100%; }

/* ===== 카드 공통 ===== */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow-1);
}
.card + .card, .block + .block { margin-top: 18px; }
.block { }

.card-h {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 18px 22px 0;
}
.card-h h2 { margin: 0; font-size: 16.5px; font-weight: 700; }
.card-h .hint { font-size: 12.5px; color: var(--muted); }
.card-b { padding: 16px 22px 22px; }

/* ===== 업로드 ===== */
.upload-card { padding: 18px; }

.dropzone {
  display: block;
  width: 100%;
  padding: 26px 20px;
  text-align: center;
  background: var(--blue-050);
  border: 2px dashed #a9c8f0;
  border-radius: 14px;
  cursor: pointer;
  transition: border-color .18s, background-color .18s, box-shadow .18s;
}
.dropzone:hover { border-color: var(--blue-500); background: #e9f1fd; }
.dropzone:focus-visible { outline: 3px solid var(--blue-500); outline-offset: 2px; }
.dropzone.dragover {
  border-style: solid;
  border-color: var(--blue-600);
  background: var(--blue-100);
  box-shadow: 0 10px 26px rgba(29,95,191,.16);
}
.dz-title { margin: 0; font-size: 16px; font-weight: 700; color: var(--blue-700); }
.dz-desc  { margin: 6px 0 0; font-size: 13.5px; color: var(--ink-2); }
.dz-hint  { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }
#fileInput { display: none; }

.kinds { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.kind-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--blue-700);
  background: var(--blue-050);
  border: 1px solid var(--blue-100);
  border-radius: 999px;
}
.kind-chip .ok { color: var(--good); font-weight: 700; }
.kind-chip .n { color: var(--muted); font-weight: 600; }

.files { list-style: none; margin: 12px 0 0; padding: 0; }
.files li {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; margin-top: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 11px;
  font-size: 13.5px;
}
.files .fname { font-weight: 600; word-break: break-all; }
.files .fmeta { margin-left: auto; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.files .btn-x {
  width: 26px; height: 26px; flex: 0 0 auto;
  font-size: 16px; line-height: 1;
  color: var(--muted); background: transparent; border: none; border-radius: 7px; cursor: pointer;
}
.files .btn-x:hover { background: var(--critical-bg); color: var(--critical); }

.upload-foot { margin-top: 14px; text-align: right; }
.upload-foot[hidden] { display: none; }

.btn-file {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 14px;
  font-size: 14px; font-weight: 600;
  color: var(--blue-700); background: var(--surface);
  border: 1px solid var(--line); border-radius: 11px;
  cursor: pointer; box-shadow: var(--shadow-1);
  transition: background-color .15s ease, border-color .15s ease;
}
.btn-file:hover { background: var(--blue-050); border-color: var(--blue-500); }
.btn-file:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 1px; }
.btn-file[aria-expanded="true"] { background: var(--blue-100); border-color: var(--blue-500); }
.btn-file .n {
  min-width: 18px; padding: 1px 6px;
  font-size: 12px; font-weight: 700;
  color: #fff; background: var(--blue-500); border-radius: 999px;
}
.btn-file .n:empty { display: none; }

.btn-ghost {
  font-size: 13px; font-weight: 600;
  color: var(--blue-700); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 7px 12px; cursor: pointer;
}
.btn-ghost:hover { background: var(--blue-050); border-color: var(--blue-500); }

/* 아직 다루지 않는 형식의 파일 안내 */
.unknown {
  margin: 14px 0 0; padding: 14px 16px;
  background: #fbfaf5;
  border: 1px solid #ece5cf;
  border-radius: 12px;
}
.unknown[hidden] { display: none; }
.unknown .u-head { font-size: 13.5px; font-weight: 700; color: #7a6320; margin: 0 0 10px; }
.unknown ul { list-style: none; margin: 0; padding: 0; }
.unknown li {
  padding: 9px 0;
  border-top: 1px solid #f0ebda;
  font-size: 13px;
  line-height: 1.6;
}
.unknown li:first-of-type { border-top: none; }
.unknown .u-name { font-weight: 700; color: var(--ink); word-break: break-all; }
.unknown .u-n { color: var(--muted); font-weight: 600; }
.unknown .u-cols { margin-top: 4px; color: var(--ink-2); }
.unknown .u-cols code {
  display: inline-block;
  padding: 1px 6px; margin: 2px 3px 2px 0;
  font-family: inherit; font-size: 12px;
  background: #fff; border: 1px solid #ebe4d0; border-radius: 6px;
}
.unknown .u-foot { margin: 10px 0 0; font-size: 12.5px; color: #7a6320; }

.notice {
  margin: 14px 0 0; padding: 12px 14px;
  font-size: 13.5px; line-height: 1.6;
  color: #7a5300; background: #fff8e6; border: 1px solid #f2ddab; border-radius: 12px;
}
.notice.error { color: var(--critical); background: var(--critical-bg); border-color: #f3c9c9; }
.notice[hidden] { display: none; }

/* ===== 통계 카드 ===== */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.stats.n3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
@media (max-width: 860px) { .stats, .stats.n3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }

.stat {
  padding: 18px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow-1);
}
.stat .lb { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.stat .vl { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.stat .un { margin-left: 3px; font-size: 15px; font-weight: 600; color: var(--muted); }
.stat .sb { margin: 7px 0 0; font-size: 12.5px; color: var(--muted); }
.stat.hero {
  background: linear-gradient(135deg, var(--blue-600) 0%, var(--blue-400) 100%);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 8px 22px rgba(37,106,191,.28);
}
.stat.hero .lb, .stat.hero .sb { color: rgba(255,255,255,.9); }
.stat.hero .un { color: rgba(255,255,255,.85); }
.stat.hero .vl { font-size: 40px; }
.stat.danger .vl { color: var(--critical); }

/* ===== 차트 ===== */
.chart-row { display: grid; grid-template-columns: 1.45fr 1fr; gap: 18px; }
@media (max-width: 940px) { .chart-row { grid-template-columns: 1fr; } }

.chart { width: 100%; overflow: visible; display: block; }
.chart text { font-family: inherit; }
.axis-label { font-size: 12px; fill: var(--muted); }
.tick-label { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.val-label  { font-size: 12.5px; font-weight: 700; fill: var(--ink); font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: #cfd8e6; stroke-width: 1; }
.mark { transition: opacity .12s ease; cursor: default; }
.mark:hover { opacity: .82; }

.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
.legend .item { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; }
.legend .n { color: var(--muted); font-variant-numeric: tabular-nums; }

.donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut-legend { list-style: none; margin: 0; padding: 0; flex: 1 1 150px; }
.donut-legend li {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; font-size: 13.5px;
  border-bottom: 1px solid var(--grid);
}
.donut-legend li:last-child { border-bottom: none; }
.donut-legend .sw { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; }
.donut-legend .nm { font-weight: 600; }
.donut-legend .vv { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ===== 과세특 초안 : 설정 폼 ===== */
.form-row { margin-bottom: 18px; }
.form-row > label {
  display: block; margin-bottom: 6px;
  font-size: 14px; font-weight: 700; color: var(--ink);
}
.form-row .desc { margin: 0 0 8px; font-size: 13px; color: var(--muted); line-height: 1.6; }

.input-text, .input-key {
  width: 100%; max-width: 480px;
  padding: 11px 13px;
  font-family: inherit; font-size: 14px;
  color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 11px;
}
.input-key { letter-spacing: 2px; }
.input-text:focus-visible, .input-key:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 1px; }
.input-text[hidden] { display: none; }

.form-row select { max-width: 480px; width: 100%; }

.key-state {
  display: inline-flex; align-items: center; gap: 7px;
  margin-top: 8px; padding: 5px 11px;
  font-size: 12.5px; font-weight: 600;
  border-radius: 999px;
}
.key-state.on  { color: var(--good); background: var(--good-bg); }
.key-state.off { color: var(--ink-2); background: var(--page); }

.form-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 4px; }

.btn-primary {
  padding: 11px 20px;
  font-family: inherit; font-size: 14.5px; font-weight: 700;
  color: #fff; background: var(--blue-600);
  border: none; border-radius: 11px; cursor: pointer;
  box-shadow: 0 2px 8px rgba(37,106,191,.25);
}
.btn-primary:hover { background: var(--blue-700); }
.btn-primary:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; }

.save-msg { font-size: 13px; font-weight: 600; color: var(--good); }
.save-msg[hidden] { display: none; }

.info-box {
  padding: 14px 16px;
  font-size: 13.5px; line-height: 1.75;
  color: var(--ink-2);
  background: var(--blue-050);
  border: 1px solid var(--blue-100);
  border-radius: 12px;
}
.info-box + .info-box { margin-top: 12px; }
.info-box a { color: var(--blue-700); font-weight: 700; }
.info-box strong { color: var(--ink); }
.info-box.warn {
  color: #7a5300; background: #fff8e6; border-color: #f2ddab;
}
.info-box.warn strong { color: #6b4700; }
.info-box.next { color: var(--muted); background: #fafbfd; border-color: var(--line); }

/* ===== 과세특 : 보낼 데이터 고르기 ===== */
.pick-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.pick-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 13px 15px;
  background: var(--surface);
  border: 1px solid var(--line); border-radius: 13px;
  cursor: pointer;
  transition: border-color .15s ease, background-color .15s ease, opacity .15s ease;
}
.pick-item:hover { border-color: var(--blue-500); background: var(--blue-050); }
.pick-item.off { opacity: .5; background: #fafbfd; }
.pick-item input[type="checkbox"] {
  width: 17px; height: 17px; margin-top: 2px; flex: 0 0 auto;
  accent-color: var(--blue-500); cursor: pointer;
}
.pick-body { min-width: 0; }
.pick-title { font-size: 14px; font-weight: 700; color: var(--ink); }
.pick-text { margin-top: 4px; font-size: 13px; line-height: 1.7; color: var(--ink-2); word-break: break-word; }

.name-check {
  margin: 12px 0 0; padding: 9px 13px;
  font-size: 12.5px; font-weight: 600; border-radius: 10px;
}
.name-check.ok  { color: var(--good); background: var(--good-bg); }
.name-check.bad { color: var(--critical); background: var(--critical-bg); }

/* ===== 과세특 : 글 상자 ===== */
.ta {
  width: 100%;
  padding: 14px 16px;
  font-family: inherit; font-size: 14px; line-height: 1.85;
  color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 13px;
  resize: vertical;
}
.ta:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 1px; }
.ta.memo { font-size: 13.5px; line-height: 1.8; }
.ta.draft { background: #fcfdff; }

.ta-foot {
  display: flex; align-items: center; gap: 10px;
  margin: 8px 2px 14px;
  font-size: 12.5px; color: var(--muted);
}
.ta-count { font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ta-state { margin-left: auto; }
.ta-state.dirty { color: var(--serious); font-weight: 600; }

.info-box.err { color: var(--critical); background: var(--critical-bg); border-color: #f3c9c9; font-weight: 600; }

.draft-print { display: none; }

/* ===== 인쇄 메뉴 ===== */
.print-wrap { position: relative; }

.print-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 50;
  width: 280px;
  padding: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-2);
  text-align: left;
}
.print-menu[hidden] { display: none; }
.print-menu button {
  display: block;
  width: 100%;
  padding: 10px 12px;
  font-family: inherit;
  text-align: left;
  background: transparent;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
.print-menu button:hover { background: var(--blue-050); }
.print-menu button b { display: block; font-size: 14px; color: var(--ink); }
.print-menu button span { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
.print-menu .pm-check {
  display: flex; align-items: center; gap: 8px;
  margin: 4px 0 2px; padding: 9px 12px;
  font-size: 13px; color: var(--ink-2);
  border-radius: 10px; cursor: pointer;
}
.print-menu .pm-check:hover { background: var(--blue-050); }
.print-menu .pm-check input { width: 15px; height: 15px; accent-color: var(--blue-500); cursor: pointer; }

.print-menu .pm-hint {
  margin: 6px 4px 2px;
  padding-top: 8px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
  border-top: 1px solid var(--grid);
}
.print-menu .pm-hint b { color: var(--ink-2); }

/* 인쇄용 머리글 · 데이터 이름 (화면에서는 보이지 않습니다) */
.print-head, .print-tab-title { display: none; }

.viz-tip {
  position: fixed;
  z-index: 60;
  padding: 8px 11px;
  font-size: 13px;
  line-height: 1.5;
  color: #fff;
  background: rgba(20,32,54,.95);
  border-radius: 9px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .12s ease;
  white-space: nowrap;
  box-shadow: 0 6px 18px rgba(0,0,0,.22);
}
.viz-tip.on { opacity: 1; }
.viz-tip b { font-variant-numeric: tabular-nums; }

/* ===== 진단 카드 ===== */
.diag { border-left: 4px solid var(--blue-500); }
.diag .card-b { font-size: 14.5px; line-height: 1.85; color: var(--ink-2); }
.diag strong { color: var(--ink); }
.diag .pill {
  display: inline-block; padding: 1px 8px; margin: 0 2px;
  font-size: 13px; font-weight: 700; border-radius: 7px;
  background: var(--blue-050); color: var(--blue-700);
}
.diag .pill.bad { background: var(--critical-bg); color: var(--critical); }
.diag .pill.good { background: var(--good-bg); color: var(--good); }

/* ===== 표 ===== */
.table-box { overflow: auto; max-height: 60vh; border-radius: 14px; }
table { width: 100%; border-collapse: collapse; }
thead th {
  position: sticky; top: 0; z-index: 1;
  padding: 0;
  background: var(--blue-050);
  border-bottom: 2px solid var(--blue-100);
  white-space: nowrap;
  text-align: center;
}
thead th:first-child { text-align: left; }
thead .th-plain { padding: 13px 14px; font-size: 13.5px; font-weight: 700; color: var(--ink); }
thead button {
  width: 100%; padding: 13px 14px;
  font-size: 13.5px; font-weight: 700; color: var(--ink);
  text-align: inherit; background: transparent; border: none; cursor: pointer;
}
thead button:hover { background: var(--blue-100); }
thead .arrow { margin-left: 4px; font-size: 10px; color: var(--blue-500); }
tbody td {
  padding: 12px 14px;
  font-size: 14px; text-align: center;
  border-bottom: 1px solid var(--grid);
  font-variant-numeric: tabular-nums;
}
tbody td:first-child { text-align: left; font-weight: 600; font-variant-numeric: normal; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--blue-050); }
tbody tr.low td { background: #fdeeee; }
tbody tr.low:hover td { background: #fbe2e2; }
tbody tr.low td:first-child { color: var(--critical); }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:focus-visible { outline: 2px solid var(--blue-500); outline-offset: -2px; }
.table-foot { margin: 12px 2px 0; font-size: 12.5px; color: var(--muted); line-height: 1.6; }

.lv {
  display: inline-block; min-width: 24px; padding: 3px 9px;
  font-size: 12.5px; font-weight: 700; border-radius: 8px;
  background: var(--blue-100); color: var(--blue-700);
}
tr.low .lv { background: #f8cfcc; color: var(--critical); }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; font-size: 12.5px; font-weight: 700; border-radius: 999px;
  white-space: nowrap;
}
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.badge.b-critical { color: var(--critical); background: var(--critical-bg); }
.badge.b-serious  { color: var(--serious);  background: var(--serious-bg); }
.badge.b-warn     { color: var(--warn);     background: var(--warn-bg); }
.badge.b-good     { color: var(--good);     background: var(--good-bg); }

.tags { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
.tag {
  padding: 2px 8px; font-size: 12px; font-weight: 600;
  color: var(--ink-2); background: var(--page);
  border: 1px solid var(--line); border-radius: 7px; white-space: nowrap;
}
.tag.t-bad { color: var(--critical); background: var(--critical-bg); border-color: #f3cdcd; }
.tag.t-mid { color: var(--serious); background: var(--serious-bg); border-color: #f5d3bd; }
.tag.t-ok  { color: var(--good); background: var(--good-bg); border-color: #cdeacd; }

.ox { font-weight: 700; }
.ox.o { color: var(--blue-600); }
.ox.x { color: var(--critical); }

/* ===== 데이터 항목 설명 ===== */
.dict .card-b { padding-top: 6px; }
.dict .intro {
  margin: 0 0 16px; padding: 13px 15px;
  font-size: 14px; line-height: 1.75;
  color: var(--ink-2);
  background: var(--blue-050);
  border-radius: 12px;
}
.dict table { border-collapse: collapse; }
.dict tbody td { text-align: left; font-size: 13.5px; line-height: 1.7; vertical-align: top; font-variant-numeric: normal; }
.dict tbody td:first-child { white-space: nowrap; font-weight: 700; color: var(--blue-700); width: 1%; }
.dict tbody tr:hover td { background: var(--blue-050); }
.dict strong { color: var(--critical); font-weight: 700; }

/* ===== 빈 화면 ===== */
.empty {
  padding: 46px 24px; text-align: center;
  color: var(--muted); font-size: 14.5px; line-height: 1.8;
}
.empty .big { font-size: 34px; }
.empty b { color: var(--ink-2); }

.panel[hidden], [hidden] { display: none !important; }

/* ===== 좁은 화면 : 사이드바가 위쪽 가로 메뉴로 ===== */
@media (max-width: 900px) {
  .app { flex-direction: column; }
  .sidebar {
    /* 좁은 화면에서는 위쪽 가로 메뉴가 되고, 스크롤해도 위에 붙어 있습니다 */
    position: sticky;
    top: 0;
    align-self: stretch;
    height: auto;
    flex: none;
    flex-direction: row;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .topbar { position: static; }
  .brand .logo, .brand .sub, .side-label, .side-foot { display: none; }
  .brand { padding: 0; }
  .brand .title { margin: 0; font-size: 15px; white-space: nowrap; }
  #menuWrap { flex-direction: row; gap: 6px; align-items: center; }
  .side-label + .menu { margin-top: 0; }
  .menu { flex-direction: row; gap: 6px; }
  .menu button { padding: 9px 12px; font-size: 13.5px; white-space: nowrap; border-radius: 999px; }
  .menu button.active { box-shadow: none; }
  .menu button .tag { display: none; }
  .topbar { padding: 14px 16px; }
  .content { padding: 16px 16px 48px; }
  .chart-row { grid-template-columns: 1fr; }
}

/* ============================================================
   인쇄 (종이 · PDF)
   화면 장식은 빼고, 카드·표·그래프만 A4에 담기게 합니다.
   ============================================================ */
@media print {
  @page { size: A4 portrait; margin: 12mm 10mm; }

  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  html, body { background: #ffffff; font-size: 10pt; }

  /* 화면 전용 요소 감추기 */
  .sidebar, .topbar, .upload-card, .viz-tip, .print-menu,
  .btn-ghost, .btn-x, .btn-remove, .btn-file, .segmented, #studentSelect { display: none !important; }

  .app { display: block; }
  .main { display: block; }
  .content { padding: 0; max-width: none; }

  /* 머리글 */
  .print-head {
    display: block;
    margin: 0 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid #16233a;
  }
  .print-head .ph-title { font-size: 17pt; font-weight: 700; letter-spacing: -0.02em; }
  .print-head .ph-sub { margin-top: 3px; font-size: 9.5pt; color: #4a5568; }

  /* 데이터 이름 (모든 화면 인쇄에서 각 쪽 제목) */
  .print-tab-title {
    display: block;
    margin: 0 0 10px;
    padding: 6px 0 5px;
    font-size: 13pt;
    font-weight: 700;
    color: #16233a;
    border-bottom: 1px solid #c9d5e6;
  }

  /* 카드 : 쪽 중간에서 잘리지 않게 */
  .card, .stat, .donut-wrap, .legend { break-inside: avoid; page-break-inside: avoid; }
  /* 표가 든 카드는 통째로 미루지 않고 쪽을 넘기며 이어 인쇄합니다 */
  .card.has-table { break-inside: auto; page-break-inside: auto; }
  .card { box-shadow: none; border-color: #d3dceb; }
  .card + .card, .block + .block { margin-top: 10px; }
  .card-h { padding: 12px 14px 0; }
  .card-b { padding: 10px 14px 14px; }
  .card-h h2 { font-size: 12pt; }

  /* 카드 4개는 한 줄에 */
  .stats, .stats.n3 { grid-template-columns: repeat(4, 1fr) !important; gap: 8px; }
  .stat { padding: 10px 12px; border-color: #d3dceb; box-shadow: none; }
  .stat .vl { font-size: 19pt; }
  .stat.hero { background: #ffffff !important; border: 1px solid #9ec5f4 !important; color: #16233a !important; }
  .stat.hero .vl { color: #1c5cab !important; font-size: 21pt; }
  .stat.hero .lb { color: #4a5568 !important; }
  .stat.hero .sb { color: #8a94a6 !important; }

  /* 그래프는 위아래로 나란히 */
  .chart-row { display: block !important; }
  .chart-row > .card + .card { margin-top: 10px; }
  .chart { max-height: 78mm; }

  /* 표 : 잘린 부분 없이 전부, 머리글은 쪽마다 반복 */
  .table-box { max-height: none !important; overflow: visible !important; border-radius: 0; }
  thead { display: table-header-group; }
  thead th { position: static; background: #eef4fd !important; }
  tr { break-inside: avoid; page-break-inside: avoid; }
  tbody td { padding: 6px 8px; font-size: 8.5pt; }
  thead .th-plain, thead button { padding: 6px 8px; font-size: 8.5pt; }
  thead .arrow { display: none; }

  /* 진단 카드 */
  .diag .card-b { font-size: 10pt; line-height: 1.6; }

  /* 데이터 항목 설명은 새 쪽에서 시작 */
  .dict { break-before: page; page-break-before: always; }
  .dict tbody td { font-size: 8.5pt; line-height: 1.5; }

  /* 회차 고르는 상자는 글자만 보이게 */
  select { border: none !important; box-shadow: none !important; background: transparent !important;
           padding: 0 !important; -webkit-appearance: none; appearance: none; }

  /* 화면에서만 쓸모 있는 안내 문구는 종이에서 제외 */
  .screen-only { display: none !important; }

  /* 과세특 : 설정·선택 카드는 인쇄하지 않고, 초안은 입력상자 대신 글자로 */
  .no-print { display: none !important; }
  .ta { display: none !important; }
  .ta-foot { display: none !important; }
  .draft-print {
    display: block !important;
    padding: 14px 16px;
    font-size: 11pt; line-height: 1.9;
    border: 1px solid #d3dceb; border-radius: 8px;
    white-space: pre-wrap;
  }

  /* 데이터 항목 설명을 뺀 경우 */
  body.print-nodict .dict { display: none !important; }

  /* 모든 화면 인쇄 : 데이터마다 새 쪽 */
  body.print-all .panel + .panel { break-before: page; page-break-before: always; }
}
</style>
</head>
<body>

<div class="app">

  <!-- ===== 왼쪽 사이드바 ===== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">📐</div>
      <div class="title">학습 데이터<br>분석 및 관리</div>
      <div class="sub">2학년 3반 · 오프라인 전용</div>
    </div>

    <div id="menuWrap"></div>

    <div class="side-foot">
      🔒 올린 CSV는 이 컴퓨터 안에서만 읽습니다.<br>인터넷으로 전송되지 않습니다.
    </div>
  </aside>

  <!-- ===== 오른쪽 본문 ===== -->
  <div class="main">

    <header class="topbar">
      <div>
        <h1 id="pageTitle">종합 진단</h1>
        <p class="page-sub" id="pageSub">CSV 파일을 올려 주세요</p>
      </div>
      <span class="spacer"></span>
      <div class="controls">
        <div class="print-wrap">
          <button type="button" class="btn-file" id="printBtn" aria-expanded="false" aria-haspopup="true">
            <span aria-hidden="true">🖨</span> 인쇄
          </button>
          <div class="print-menu" id="printMenu" hidden role="menu">
            <button type="button" role="menuitem" data-print="one">
              <b>지금 화면만 인쇄</b>
              <span id="printOneSub">보고 있는 화면 한 장</span>
            </button>
            <button type="button" role="menuitem" data-print="all">
              <b id="printAllTitle">모든 화면 인쇄</b>
              <span id="printAllSub">데이터별로 쪽을 나눠 이어서 인쇄</span>
            </button>
            <label class="pm-check">
              <input type="checkbox" id="printDict"> 📖 데이터 항목 설명도 함께 인쇄
            </label>
            <p class="pm-hint">인쇄 창에서 <b>대상</b>을 ‘PDF로 저장’으로 고르면 파일로 남길 수 있습니다. 용지는 A4 세로를 권합니다.</p>
          </div>
        </div>
        <button type="button" class="btn-file" id="fileBtn" aria-expanded="false">
          <span aria-hidden="true">📂</span> 데이터 파일<span class="n" id="fileBtnN"></span>
        </button>
        <div class="segmented" id="modeToggle" role="group" aria-label="보기 방식">
          <button type="button" data-mode="class" class="active">학급 전체</button>
          <button type="button" data-mode="student">개인별</button>
        </div>
        <select id="studentSelect" hidden aria-label="학생 선택"></select>
      </div>
    </header>

    <div class="content">

      <!-- 인쇄할 때만 나오는 머리글 -->
      <div class="print-head" aria-hidden="true">
        <div class="ph-title">학습 데이터 분석 및 관리</div>
        <div class="ph-sub" id="printSub"></div>
      </div>

      <!-- 업로드 (파일을 읽고 나면 접힙니다. 위쪽 ‘데이터 파일’ 버튼으로 다시 열 수 있습니다) -->
      <section class="card upload-card block" id="uploadCard">
        <div id="dropzone" class="dropzone" tabindex="0" role="button"
             aria-label="CSV 파일 선택하기. 클릭하거나 파일을 끌어다 놓으세요.">
          <p class="dz-title">⬆ 여기를 클릭해 CSV 파일 선택</p>
          <p class="dz-desc">또는 파일을 이 상자 안으로 끌어다 놓으세요. 여러 개를 한 번에 올릴 수 있습니다.</p>
          <p class="dz-hint">성취도평가 · 형성평가 CSV를 첫 줄(컬럼명)로 자동 구분합니다</p>
        </div>
        <input type="file" id="fileInput" accept=".csv,text/csv" multiple>

        <div class="kinds" id="kinds"></div>
        <ul class="files" id="fileList"></ul>
        <div class="unknown" id="unknownBox" hidden></div>
        <p id="notice" class="notice" hidden></p>

          <button type="button" class="btn-ghost" id="uploadClose">✕ 닫고 분석 화면 보기</button>
        </div>
      </section>

      <!-- 데이터 종류별 화면 (자바스크립트가 만들어 넣습니다) -->
      <div id="panels"></div>

    </div>
  </div>
</div>

<div class="viz-tip" id="vizTip" role="status" aria-live="off"></div>

<script>
'use strict';

/* ============================================================================
   이 파일은 학생 데이터를 어디에도 보내지 않습니다.
   FileReader로 이 컴퓨터 안에서만 읽고, 화면에 그릴 뿐입니다.
   (fetch / XMLHttpRequest 등 전송 코드가 이 파일에는 없습니다.)
   ============================================================================ */

/* ====================== 0. 상태(지금 화면이 무엇을 보여주는지) ============== */
var state = {
  files: [],            // [{name, size, kind, rows}]
  unknown: [],          // 아직 다루지 않는 형식 [{name, header, count}]
  data: {},             // 데이터 종류별 행 목록 {achieve:[], formative:[], collab:[] ...}
  tab: 'overall',       // overall | achieve | formative
  mode: 'class',        // class | student
  student: '',          // 개인별로 볼 학생명
  round: '',            // 성취도평가 회차 ('' = 최신)
  sortA: { key: null, asc: true },
  messages: [],
  showUpload: true,     // 파일 올리는 상자를 펼쳐 둘지 (데이터가 들어오면 자동으로 접힙니다)
  sesta: {              // 과세특 초안 화면의 상태
    student: '', checks: {}, memo: '', memoDirty: false,
    length: 300, draft: '', draftInfo: '', error: '', models: null
  }
};

var AREAS = ['수와연산', '문자와식', '함수', '기하', '확률과통계'];
var AREA_COLS = AREAS.map(function (a) { return a + '점수'; });
var LEVELS = ['A', 'B', 'C', 'D', 'E'];
var LEVEL_COLORS = {
  A: getVar('--lv-A'), B: getVar('--lv-B'), C: getVar('--lv-C'),
  D: getVar('--lv-D'), E: getVar('--lv-E')
};
var C_BAR = getVar('--c-bar'), C_ME = getVar('--c-me'), C_CLASS = getVar('--c-class');

function getVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* 판단 기준값 — 화면 설명과 위험도 계산에서 함께 씁니다. */
var TH = {
  submitRate: 70,   // 과제제출률(%) 미만이면 이탈 신호
  correctRate: 50,  // 형성평가 정답률(%) 미만이면 위험
  lowLevels: ['D', 'E'],
  participation: 3.0,
  studyMin: 90,
  selfDirected: 40,
  retry: 2
};

/* ====================== 1. 화면 요소 ====================== */
var $ = function (id) { return document.getElementById(id); };
var dropzone = $('dropzone'), fileInput = $('fileInput'), fileListEl = $('fileList'),
    kindsEl = $('kinds'), noticeEl = $('notice'), menuEl = $('menuWrap'),
    uploadCard = $('uploadCard'), uploadFoot = $('uploadFoot'),
    uploadClose = $('uploadClose'), fileBtn = $('fileBtn'), fileBtnN = $('fileBtnN'),
    printBtn = $('printBtn'), printMenu = $('printMenu'), printSub = $('printSub'),
    pageTitle = $('pageTitle'), pageSub = $('pageSub'),
    modeToggle = $('modeToggle'), studentSelect = $('studentSelect'),
    vizTip = $('vizTip');
var panels = {};        // 탭 이름 → 화면 내용이 그려지는 칸
var panelSections = {}; // 탭 이름 → 겉껍데기 section (숨기기/보이기에 사용)
var TAB_TITLE = {};   // 탭 이름 → 제목 (아래 setupTabs 에서 채웁니다)

/* ====================== 2. 파일 고르기 ====================== */
dropzone.addEventListener('click', function () { fileInput.click(); });
dropzone.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); fileInput.click(); }
});
fileInput.addEventListener('change', function () { addFiles(fileInput.files); fileInput.value = ''; });

['dragenter', 'dragover'].forEach(function (t) {
  dropzone.addEventListener(t, function (e) { e.preventDefault(); e.stopPropagation(); dropzone.classList.add('dragover'); });
});
['dragleave', 'drop'].forEach(function (t) {
  dropzone.addEventListener(t, function (e) { e.preventDefault(); e.stopPropagation(); dropzone.classList.remove('dragover'); });
});
dropzone.addEventListener('drop', function (e) {
  if (e.dataTransfer && e.dataTransfer.files) { addFiles(e.dataTransfer.files); }
});
window.addEventListener('dragover', function (e) { e.preventDefault(); });
window.addEventListener('drop', function (e) { e.preventDefault(); });

function addFiles(list) {
  var skipped = [], dupes = 0, fresh = [];
  for (var i = 0; i < list.length; i++) {
    var f = list[i];
    if (!/\.csv$/i.test(f.name)) { skipped.push(f.name); continue; }
    if (state.files.some(function (x) { return x.name === f.name && x.size === f.size; })) { dupes++; continue; }
    fresh.push(f);
  }
  state.messages = [];
  if (skipped.length) { state.messages.push('CSV 파일이 아니어서 제외했습니다: ' + skipped.join(', ')); }
  if (dupes) { state.messages.push('이미 올린 파일 ' + dupes + '개는 다시 넣지 않았습니다.'); }
  if (!fresh.length) { showNotice(); return; }

  Promise.all(fresh.map(readOne)).then(function (results) {
    results.forEach(function (r) {
      if (r.unknown) {
        if (!state.unknown.some(function (u) { return u.name === r.name; })) {
          state.unknown.push({ name: r.name, header: r.header, count: r.count });
        }
        return;
      }
      if (r.error) { state.messages.push('“' + r.name + '”: ' + r.error); return; }
      state.files.push({ name: r.name, size: r.size, kind: r.kind, rows: r.rows });
      if (r.warning) { state.messages.push('“' + r.name + '”: ' + r.warning); }
    });
    /* 읽을 수 있는 데이터가 생기면 업로드 상자를 접고 분석 화면을 보여 줍니다.
       읽지 못한 파일이나 안내 문구가 있으면 그대로 펼쳐 둡니다. */
    var ok = DATA_KINDS.some(function (k) { return (state.data[k] || []).length; }) ||
             state.files.length > 0;
    state.showUpload = !ok || state.messages.length > 0 || state.unknown.length > 0;
    rebuild();
  });
}

/* ====================== 3. 파일 읽기 (FileReader) ====================== */
function readOne(file) {
  return new Promise(function (resolve) {
    var reader = new FileReader();
    reader.onerror = function () { resolve({ name: file.name, error: '파일을 읽지 못했습니다.' }); };
    reader.onload = function () {
      var text;
      try { text = decodeText(reader.result); }
      catch (e) { resolve({ name: file.name, error: '글자 인코딩을 알아볼 수 없습니다.' }); return; }
      var out = convert(file.name, text);
      out.size = file.size;
      resolve(out);
    };
    reader.readAsArrayBuffer(file);   // 인코딩을 직접 판단하려고 원본 바이트로 읽습니다.
  });
}

/* 엑셀에서 저장한 한글 CSV는 UTF-8이 아닐 때가 많습니다.
   UTF-8로 먼저 시도하고, 글자가 깨지면 EUC-KR(CP949)로 다시 읽습니다. */
function decodeText(buffer) {
  var bytes = new Uint8Array(buffer);
  if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
    bytes = bytes.subarray(3);   // BOM 제거
  }
  try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
  catch (e) { return new TextDecoder('euc-kr').decode(bytes); }
}

/* ---- CSV 해석 : 큰따옴표 안의 쉼표·줄바꿈, "" 이스케이프, \r\n 모두 처리 ---- */
function parseCsv(text) {
  var rows = [], row = [], value = '', inQ = false, i = 0;
  while (i < text.length) {
    var ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i + 1] === '"') { value += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      value += ch; i++; continue;
    }
    if (ch === '"') { inQ = true; i++; continue; }
    if (ch === ',') { row.push(value); value = ''; i++; continue; }
    if (ch === '\r') { if (text[i + 1] === '\n') { i++; } row.push(value); rows.push(row); row = []; value = ''; i++; continue; }
    if (ch === '\n') { row.push(value); rows.push(row); row = []; value = ''; i++; continue; }
    value += ch; i++;
  }
  if (value !== '' || row.length > 0) { row.push(value); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
}

/* ---- 첫 줄(헤더)을 보고 데이터 종류를 자동으로 구분 ---- */
function detectKind(header) {
  var has = function (name) { return header.indexOf(name) !== -1; };
  if (has('수와연산점수') && has('성취수준')) { return 'achieve'; }
  if (has('문항번호') && has('성취기준코드')) { return 'formative'; }
  for (var i = 0; i < EXTRA_SPECS.length; i++) {          // 나중에 추가한 여섯 종류
    var need = EXTRA_SPECS[i].need, ok = true;
    for (var j = 0; j < need.length; j++) { if (!has(need[j])) { ok = false; break; } }
    if (ok) { return EXTRA_SPECS[i].key; }
  }
  return null;
}

function convert(fileName, text) {
  var table = parseCsv(text);
  if (table.length === 0) { return { name: fileName, error: '내용이 비어 있습니다.' }; }
  if (table.length === 1) { return { name: fileName, error: '첫 줄(컬럼명)만 있고 데이터가 없습니다.' }; }

  var header = table[0].map(function (h) { return String(h).trim(); });
  var kind = detectKind(header);
  if (!kind) {
    /* 아직 다루지 않는 형식입니다. 파일을 버리지 않고 첫 줄(열 이름)만 보여 주어,
       어떤 데이터를 추가하면 되는지 한눈에 알 수 있게 합니다. */
    return { name: fileName, unknown: true, header: header, count: table.length - 1 };
  }

  var rows = [], broken = 0;
  for (var r = 1; r < table.length; r++) {
    var cells = table[r];
    if (cells.length !== header.length) { broken++; }
    var obj = {};
    for (var c = 0; c < header.length; c++) {
      obj[header[c]] = cells[c] === undefined ? '' : String(cells[c]).trim();
    }
    obj.__file = fileName;
    rows.push(obj);
  }
  return {
    name: fileName, kind: kind, rows: rows,
    warning: broken ? ('칸 수가 첫 줄과 다른 줄 ' + broken + '개는 빈 값으로 처리했습니다.') : null
  };
}

/* ====================== 4. 값 다루기 도우미 ====================== */
function toNum(v) {
  if (v === undefined || v === null) { return null; }
  var s = String(v).replace(/,/g, '').replace(/%/g, '').trim();
  if (s === '') { return null; }
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function mean(list) {
  var v = list.filter(function (x) { return x !== null && !isNaN(x); });
  if (!v.length) { return null; }
  return v.reduce(function (a, b) { return a + b; }, 0) / v.length;
}
function fmt(n, d) { return n === null || n === undefined ? '-' : n.toFixed(d === undefined ? 1 : d); }
function level(row) { return String(row['성취수준'] || '').trim().toUpperCase(); }
function isLow(lv) { return TH.lowLevels.indexOf(lv) !== -1; }

/* 정답여부는 학교마다 표기가 달라서 여러 형태를 모두 인정합니다. */
var YES = ['O', '정답', 'Y', 'YES', 'T', 'TRUE', '1', '맞음', '참', '성공'];
var NO  = ['X', '오답', 'N', 'NO', 'F', 'FALSE', '0', '틀림', '거짓', '실패'];
function isCorrect(v) {
  var s = String(v === undefined ? '' : v).trim().toUpperCase();
  if (YES.indexOf(s) !== -1) { return true; }
  if (NO.indexOf(s) !== -1) { return false; }
  return null;   // 알 수 없음
}
function usedAI(v) {
  var s = String(v === undefined ? '' : v).trim().toUpperCase();
  return ['Y', 'YES', 'O', 'TRUE', '1', '사용', '있음', '예', '사용함'].indexOf(s) !== -1;
}

/* ====================== 5. 데이터 묶기(집계) ====================== */
function rounds() {
  var out = [];
  state.data.achieve.forEach(function (r) {
    var v = r['회차'];
    if (v && out.indexOf(v) === -1) { out.push(v); }
  });
  out.sort(function (a, b) {
    var x = toNum(a), y = toNum(b);
    return (x !== null && y !== null) ? x - y : String(a).localeCompare(String(b), 'ko');
  });
  return out;
}
function currentRound() {
  var rs = rounds();
  if (state.round && (state.round === '__ALL__' || rs.indexOf(state.round) !== -1)) { return state.round; }
  return rs.length ? rs[rs.length - 1] : '';
}
function achieveRows() {
  var pick = currentRound();
  if (!pick || pick === '__ALL__') { return state.data.achieve.slice(); }
  return state.data.achieve.filter(function (r) { return r['회차'] === pick; });
}
/* 학생별 가장 최근 회차 1줄 (종합 진단·개인별 화면용) */
function latestByStudent(name) {
  var mine = state.data.achieve.filter(function (r) { return r['학생명'] === name; });
  if (!mine.length) { return null; }
  mine.sort(function (a, b) {
    var x = toNum(a['회차']), y = toNum(b['회차']);
    if (x !== null && y !== null) { return x - y; }
    return String(a['평가일'] || '').localeCompare(String(b['평가일'] || ''));
  });
  return mine[mine.length - 1];
}
function studentNames() {
  var out = [];
  DATA_KINDS.forEach(function (k) {
    (state.data[k] || []).forEach(function (r) {
      var n = r['학생명'];
      if (n && out.indexOf(n) === -1) { out.push(n); }
    });
  });
  return out.sort(function (a, b) { return a.localeCompare(b, 'ko'); });
}
function formativeOf(name) {
  return state.data.formative.filter(function (r) { return r['학생명'] === name; });
}
function correctRate(rows) {
  var ok = 0, total = 0;
  rows.forEach(function (r) {
    var c = isCorrect(r['정답여부']);
    if (c === null) { return; }
    total++; if (c) { ok++; }
  });
  return total ? { rate: ok / total * 100, ok: ok, total: total } : { rate: null, ok: 0, total: 0 };
}
function rateByKey(rows, key) {
  var map = {};
  rows.forEach(function (r) {
    var k = r[key] || '(없음)';
    var c = isCorrect(r['정답여부']);
    if (c === null) { return; }
    if (!map[k]) { map[k] = { ok: 0, total: 0 }; }
    map[k].total++; if (c) { map[k].ok++; }
  });
  return map;
}
function errorCounts(rows) {
  var map = {};
  rows.forEach(function (r) {
    if (isCorrect(r['정답여부']) === true) { return; }   // 맞힌 문항은 세지 않습니다
    var raw = String(r['오류유형'] || '').trim();
    if (!raw || raw === '-' || raw === '없음') { return; }
    raw.split(/[;,·/]/).forEach(function (t) {
      var k = t.trim();
      if (!k) { return; }
      map[k] = (map[k] || 0) + 1;
    });
  });
  return map;
}
function areaMeans(rows) {
  return AREAS.map(function (a, i) {
    return { label: a, value: mean(rows.map(function (r) { return toNum(r[AREA_COLS[i]]); })) };
  });
}

/* ====================== 6. SVG 차트 (라이브러리 없이 직접 그림) ====================== */
var SVGNS = 'http://www.w3.org/2000/svg';
function el(name, attrs) {
  var n = document.createElementNS(SVGNS, name);
  if (attrs) { Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); }); }
  return n;
}
function txt(x, y, s, cls, anchor) {
  var t = el('text', { x: x, y: y, class: cls || 'tick-label' });
  if (anchor) { t.setAttribute('text-anchor', anchor); }
  t.textContent = s;
  return t;
}
/* 위쪽 두 각만 둥근 막대 (아래는 기준선에 붙임) */
function barPath(x, y, w, h, r) {
  var rr = Math.max(0, Math.min(r, h, w / 2));
  return 'M' + x + ',' + (y + h) + ' V' + (y + rr) +
         ' q0,' + (-rr) + ' ' + rr + ',' + (-rr) +
         ' h' + (w - 2 * rr) +
         ' q' + rr + ',0 ' + rr + ',' + rr +
         ' V' + (y + h) + ' Z';
}
/* 오른쪽 두 각만 둥근 가로 막대 */
function hBarPath(x, y, w, h, r) {
  var rr = Math.max(0, Math.min(r, w, h / 2));
  return 'M' + x + ',' + y + ' h' + (w - rr) +
         ' q' + rr + ',0 ' + rr + ',' + rr +
         ' v' + (h - 2 * rr) +
         ' q0,' + rr + ' ' + (-rr) + ',' + rr +
         ' H' + x + ' Z';
}
function tipOn(node, html) {
  node.addEventListener('mouseenter', function () { vizTip.innerHTML = html; vizTip.classList.add('on'); });
  node.addEventListener('mousemove', function (e) {
    vizTip.style.left = Math.min(window.innerWidth - vizTip.offsetWidth - 10, e.clientX + 14) + 'px';
    vizTip.style.top = Math.max(8, e.clientY - vizTip.offsetHeight - 12) + 'px';
  });
  node.addEventListener('mouseleave', function () { vizTip.classList.remove('on'); });
}

/* ---- 세로 막대그래프 : 한 계열 또는 두 계열(학생 vs 학급) ---- */
function barChart(opts) {
  var data = opts.data;                       // [{label, value, value2?}]
  var W = 100, H = opts.height || 260;
  var pad = { t: 26, r: 8, b: 40, l: 38 };
  var max = opts.max || 100;
  var two = !!opts.series2;

  /* 글자가 늘어나지 않도록 비율을 유지한 채 폭에 맞춰 커집니다. */
  var svg = el('svg', { class: 'chart', viewBox: '0 0 700 ' + H,
                        role: 'img', 'aria-label': opts.aria || '막대그래프' });
  svg.style.width = '100%';
  svg.style.height = 'auto';
  var VW = 700;
  var plotW = VW - pad.l - pad.r, plotH = H - pad.t - pad.b;
  var y = function (v) { return pad.t + plotH - (v / max) * plotH; };

  // 가로 눈금선
  [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
    var yy = pad.t + plotH - f * plotH;
    svg.appendChild(el('line', { x1: pad.l, y1: yy, x2: VW - pad.r, y2: yy,
                                 class: f === 0 ? 'baseline' : 'gridline' }));
    svg.appendChild(txt(pad.l - 8, yy + 4, Math.round(max * f) + (opts.unit || ''), 'tick-label', 'end'));
  });

  var slot = plotW / data.length;
  var barW = two ? Math.min(38, slot * 0.30) : Math.min(64, slot * 0.52);
  var gap = 2;  // 막대 사이 흰 간격

  data.forEach(function (d, i) {
    var cx = pad.l + slot * i + slot / 2;
    var vals = two ? [{ v: d.value, c: C_ME, nm: opts.series1 }, { v: d.value2, c: C_CLASS, nm: opts.series2 }]
                   : [{ v: d.value, c: (opts.colors && opts.colors[i]) || C_BAR, nm: opts.series1 }];
    var groupW = vals.length * barW + (vals.length - 1) * gap;

    vals.forEach(function (s, j) {
      if (s.v === null || s.v === undefined) { return; }
      var x = cx - groupW / 2 + j * (barW + gap);
      var h = Math.max(2, (s.v / max) * plotH);
      var p = el('path', { d: barPath(x, pad.t + plotH - h, barW, h, 4), fill: s.c, class: 'mark' });
      tipOn(p, '<b>' + d.label + '</b><br>' + (s.nm ? s.nm + ' ' : '') + fmt(s.v, 1) + (opts.unit || ''));
      svg.appendChild(p);

      // 값 라벨 (막대가 짧으면 위에)
      svg.appendChild(txt(x + barW / 2, pad.t + plotH - h - 7, fmt(s.v, opts.digits === undefined ? 1 : opts.digits),
                          'val-label', 'middle'));
    });

    var lb = txt(cx, H - pad.b + 20, d.label, 'axis-label', 'middle');
    svg.appendChild(lb);
    if (d.note) { svg.appendChild(txt(cx, H - pad.b + 35, d.note, 'tick-label', 'middle')); }
  });

  /* 기준선(예: 학급 전체 정답률)은 막대 위에 그려야 가려지지 않습니다.
     숫자는 그래프 안에 겹쳐 쓰지 않고 아래 범례에 적습니다. */
  if (opts.refLine !== undefined && opts.refLine !== null) {
    svg.appendChild(el('line', { x1: pad.l, y1: y(opts.refLine), x2: VW - pad.r, y2: y(opts.refLine),
                                 stroke: '#8a94a6', 'stroke-width': 2, 'stroke-dasharray': '6 4' }));
  }

  return svg;
}

/* ---- 가로 막대그래프 (오류유형 분포 등) ---- */
function hBarChart(opts) {
  var data = opts.data;                    // [{label, value}]
  var VW = opts.vw || 700;                 // 반쪽 폭 카드에서는 좁게 → 글자가 커집니다
  var scale = VW / 700;
  var rowH = 34 * (opts.vw ? 1.15 : 1), padL = 108 * scale + 20, padR = 54 * scale + 14, padT = 6;
  var H = padT + data.length * rowH + 8;
  var max = opts.max || Math.max.apply(null, data.map(function (d) { return d.value; })) || 1;

  var svg = el('svg', { class: 'chart', viewBox: '0 0 ' + VW + ' ' + H,
                        role: 'img', 'aria-label': opts.aria || '가로 막대그래프' });
  svg.style.width = '100%';
  svg.style.height = 'auto';

  data.forEach(function (d, i) {
    var y0 = padT + i * rowH;
    var barH = 18;
    var w = Math.max(2, (d.value / max) * (VW - padL - padR));
    svg.appendChild(txt(padL - 10, y0 + barH / 2 + 5, d.label, 'axis-label', 'end'));
    svg.appendChild(el('rect', { x: padL, y: y0, width: VW - padL - padR, height: barH, rx: 5, fill: '#f1f4f9' }));
    var p = el('path', { d: hBarPath(padL, y0, w, barH, 4), fill: opts.color || C_BAR, class: 'mark' });
    tipOn(p, '<b>' + d.label + '</b><br>' + d.value + (opts.unit || '') + (d.tip ? '<br>' + d.tip : ''));
    svg.appendChild(p);
    svg.appendChild(txt(padL + w + 8, y0 + barH / 2 + 5, d.value + (opts.unit || ''), 'val-label', 'start'));
  });
  return svg;
}

/* ---- 도넛 차트 ---- */
function donutChart(items, opts) {
  opts = opts || {};
  var size = 200, r = 78, thick = 26, cx = size / 2, cy = size / 2;
  var total = items.reduce(function (a, b) { return a + b.value; }, 0);

  var svg = el('svg', { class: 'chart', viewBox: '0 0 ' + size + ' ' + size,
                        role: 'img', 'aria-label': opts.aria || '도넛 차트' });
  svg.style.width = size + 'px';
  svg.style.height = size + 'px';
  svg.style.flex = '0 0 auto';

  if (total === 0) {
    svg.appendChild(el('circle', { cx: cx, cy: cy, r: r, fill: 'none', stroke: '#eef2f8', 'stroke-width': thick }));
    return svg;
  }

  var GAP = 0.035;                     // 조각 사이 흰 간격(라디안)
  var angle = -Math.PI / 2;            // 12시 방향에서 시작
  items.forEach(function (it) {
    if (it.value <= 0) { return; }
    var span = (it.value / total) * Math.PI * 2;
    var a0 = angle + (items.filter(function (x) { return x.value > 0; }).length > 1 ? GAP / 2 : 0);
    var a1 = angle + span - (items.filter(function (x) { return x.value > 0; }).length > 1 ? GAP / 2 : 0);
    angle += span;
    if (a1 <= a0) { return; }

    var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    var x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    var large = (a1 - a0) > Math.PI ? 1 : 0;
    var path = el('path', {
      d: 'M' + x0 + ',' + y0 + ' A' + r + ',' + r + ' 0 ' + large + ' 1 ' + x1 + ',' + y1,
      fill: 'none', stroke: it.color, 'stroke-width': thick, 'stroke-linecap': 'butt', class: 'mark'
    });
    tipOn(path, '<b>' + it.label + '</b><br>' + it.value + '명 (' + (it.value / total * 100).toFixed(1) + '%)');
    svg.appendChild(path);
  });

  var c1 = txt(cx, cy - 2, String(opts.centerValue !== undefined ? opts.centerValue : total), 'val-label', 'middle');
  c1.setAttribute('style', 'font-size:26px');
  svg.appendChild(c1);
  svg.appendChild(txt(cx, cy + 18, opts.centerLabel || '명', 'tick-label', 'middle'));
  return svg;
}

/* ====================== 7. 작은 화면 조각 만들기 ====================== */
function node(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) { n.className = cls; }
  if (text !== undefined) { n.textContent = text; }
  return n;
}
function statCard(o) {
  var d = node('div', 'stat' + (o.hero ? ' hero' : '') + (o.danger ? ' danger' : ''));
  d.appendChild(node('p', 'lb', o.label));
  var v = node('div', 'vl');
  v.appendChild(document.createTextNode(o.value));
  if (o.unit) { v.appendChild(node('span', 'un', o.unit)); }
  d.appendChild(v);

function richText(target, str) {
  String(str).split('**').forEach(function (part, i) {
    if (part === '') { return; }
    target.appendChild(i % 2 ? node('strong', null, part) : document.createTextNode(part));
  });

/* ====================== 8. 위험도(종합 진단) 계산 ====================== */
function riskOf(name) {
  var a = latestByStudent(name);
  var f = correctRate(formativeOf(name));
  var lv = a ? level(a) : '';
  var avg = a ? toNum(a['평균']) : null;
  var submit = a ? toNum(a['과제제출률']) : null;

  var score = 0, tags = [];
  if (lv && isLow(lv)) { score += 3; tags.push({ t: '성취수준' + lv, k: 'bad' }); }
  if (f.rate !== null && f.rate < TH.correctRate) { score += 2; tags.push({ t: '형성평가정답률↓', k: 'bad' }); }
  if (submit !== null && submit < TH.submitRate) { score += 1; tags.push({ t: '과제제출률↓', k: 'mid' }); }

  /* 나중에 추가한 데이터에서 나온 위험 신호 (종류마다 규칙 한 가지) */
  EXTRA_SPECS.forEach(function (s) {
    var rows = state.data[s.key] || [];
    if (!rows.length || !s.risk) { return; }
    var mine = byStudent(rows, name);
    if (!mine.length) { return; }
    if (s.risk.test(mine)) { score += s.risk.points; tags.push({ t: s.risk.tag, k: 'mid' }); }
  });

  var grade;
  if (score >= 4)      { grade = { label: '집중지원', cls: 'b-critical' }; }
  else if (score >= 2) { grade = { label: '지원필요', cls: 'b-serious' }; }
  else if (score >= 1) { grade = { label: '관찰',     cls: 'b-warn' }; }
  else                 { grade = { label: '양호',     cls: 'b-good' }; }

  return {
    name: name, level: lv, avg: avg, rate: f.rate, ok: f.ok, total: f.total,
    submit: submit, score: score, grade: grade, tags: tags, round: a ? a['회차'] : ''
  };
}
function allRisks() {
  return studentNames().map(riskOf).sort(function (x, y) {
    if (y.score !== x.score) { return y.score - x.score; }          // 위험도 높은 순
    var ax = x.avg === null ? 999 : x.avg, ay = y.avg === null ? 999 : y.avg;
    if (ax !== ay) { return ax - ay; }                               // 그다음 평균 낮은 순
    return x.name.localeCompare(y.name, 'ko');
  });
}

function achieveTable(rows) {
  var sorted = rows.slice();
  var sk = state.sortA.key;
  if (sk) {
    sorted.sort(function (a, b) {
      var x, y;
      if (sk === 'total') { x = toNum(a['총점']); y = toNum(b['총점']); }
      else if (sk === 'avg') { x = toNum(a['평균']); y = toNum(b['평균']); }
      else if (sk === 'level') { x = level(a); y = level(b); }
      else { x = a['학생명']; y = b['학생명']; }
      if (x === null || x === '') { return 1; }
      if (y === null || y === '') { return -1; }
      var cmp = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y), 'ko');
      return state.sortA.asc ? cmp : -cmp;
    });
  }

  var box = node('div', 'table-box');
  var table = node('table');
  var thead = node('thead');
  var tr = node('tr');
  [['name', '학생명'], ['total', '총점'], ['avg', '평균'], ['level', '성취수준']].forEach(function (c) {
    var th = node('th'); th.setAttribute('scope', 'col');
    var b = node('button', null, c[1]);
    b.type = 'button';
    var ar = node('span', 'arrow', sk === c[0] ? (state.sortA.asc ? '▲' : '▼') : '');
    b.appendChild(ar);
    b.addEventListener('click', function () {
      if (state.sortA.key === c[0]) { state.sortA.asc = !state.sortA.asc; }
      else { state.sortA.key = c[0]; state.sortA.asc = (c[0] === 'name' || c[0] === 'level'); }
      renderAll();
    });
    th.appendChild(b); tr.appendChild(th);
  });
  thead.appendChild(tr); table.appendChild(thead);

  var tb = node('tbody');
  var lowN = 0;
  sorted.forEach(function (r) {
    var lv = level(r);
    var trr = node('tr');
    if (isLow(lv)) { trr.className = 'low'; lowN++; }
    trr.appendChild(node('td', null, r['학생명'] || '(이름 없음)'));

    td.appendChild(node('span', 'lv', lv || '-'));
    trr.appendChild(td);
    tb.appendChild(trr);
  });
  table.appendChild(tb); box.appendChild(table);

  var foot = node('p', 'table-foot');
  var msgs = [sorted.length + '명 표시', 'D·E ' + lowN + '명(옅은 빨강)'];

  return cardBox('학생별 성취도', '학생명 · 총점 · 평균 · 성취수준', [box, foot]);
}

function renderAchieveStudent(p) {

      legendRow([{ color: C_ME, label: name + ' 학생' }, { color: C_CLASS, label: '학급 평균' }])

  body.appendChild(s1);

    body.appendChild(s4);
  }
  p.appendChild(cardBox('🩺 ' + name + ' 학생 진단', '자동 요약', [body], 'diag'));
}

/* ====================== 11. 형성평가 화면 ====================== */
function renderFormative() {
  var p = panels.formative;
  p.innerHTML = '';

  if (!state.data.formative.length) {
    p.appendChild(cardBox(null, null, emptyBox([
      '**형성평가 CSV**를 아직 올리지 않았습니다.',

function renderFormativeClass(p) {
  var rows = state.data.formative;
  var all = correctRate(rows);
  var students = [];
  rows.forEach(function (r) { if (r['학생명'] && students.indexOf(r['학생명']) === -1) { students.push(r['학생명']); } });
  var times = rows.map(function (r) { return toNum(r['풀이시간(초)']); });
  var aiN = rows.filter(function (r) { return usedAI(r['AI도움사용']); }).length;

  p.appendChild(statsRow([
    { label: '전체 정답률', value: fmt(all.rate, 1), unit: '%', hero: true,
      sub: '맞힌 문항 ' + all.ok + ' / ' + all.total + '개' },
    { label: '참여 학생', value: String(students.length), unit: '명',
      sub: '문항 기록 ' + rows.length + '줄' },
    { label: '평균 풀이시간', value: fmt(mean(times), 0), unit: '초', sub: '문항 1개당' },
    { label: 'AI 도움 사용', value: String(aiN), unit: '문항',
      sub: rows.length ? '전체의 ' + (aiN / rows.length * 100).toFixed(0) + '%' : '' }
  ]));

  /* 성취영역별 정답률 */

                  .concat(Object.keys(byArea).filter(function (k) { return AREAS.indexOf(k) === -1; }));
  var areaData = keys.map(function (k) {
    return { label: k, value: byArea[k].total ? byArea[k].ok / byArea[k].total * 100 : null,
             note: byArea[k].ok + '/' + byArea[k].total };
  });
  var lowArea = areaData.filter(function (d) { return d.value !== null; })
                        .sort(function (a, b) { return a.value - b.value; })[0];

  p.appendChild(cardBox('성취영역별 정답률', '점선은 학급 전체 정답률', [

               refLine: all.rate, refLabel: '전체', aria: '성취영역별 정답률 막대그래프' }),
    legendRow([{ color: C_BAR, label: '영역별 정답률' },
               { color: '#8a94a6', label: '학급 전체 정답률(점선)', note: fmt(all.rate, 1) + '%' }])
  ]));

  /* 오류유형 분포 */
  var errs = errorCounts(rows);
  var errData = Object.keys(errs).map(function (k) { return { label: k, value: errs[k] }; })
                      .sort(function (a, b) { return b.value - a.value; });
  var errTotal = errData.reduce(function (a, b) { return a + b.value; }, 0);
  errData.forEach(function (d) { d.tip = errTotal ? '오답 중 ' + (d.value / errTotal * 100).toFixed(0) + '%' : ''; });

  p.appendChild(cardBox('오답 오류유형 분포', '틀린 문항 ' + (all.total - all.ok) + '개 기준',
    errData.length ? [hBarChart({ data: errData, unit: '건', aria: '오류유형 분포 가로 막대그래프' })]
                   : [emptyBox(['기록된 오류유형이 없습니다.'])]));

  /* 학급 진단 */
  var body = node('div');
  var s1 = node('p');
  richText(s1, '형성평가 전체 정답률은 **' + fmt(all.rate, 1) + '%**입니다(' + all.ok + '/' + all.total + '문항). ' +
    (lowArea ? '가장 낮은 성취영역은 **' + lowArea.label + '(' + fmt(lowArea.value, 1) + '%)**입니다.' : ''));
  body.appendChild(s1);

  if (errData.length) {
    var s2 = node('p');
    richText(s2, '오답의 가장 큰 원인은 **' + errData[0].label + '(' + errData[0].value + '건)**입니다. ' +
      (errData[0].label.indexOf('계산') === 0 ? '연산 연습을 반복해 주는 편이 좋습니다.'
       : errData[0].label.indexOf('개념') === 0 ? '개념을 다시 설명하는 시간이 필요합니다.'

  var s3 = node('p');

    richText(s3, '정답률 **' + TH.correctRate + '% 미만 학생은 ' + weakStudents.length + '명**입니다(' +
      weakStudents.map(function (x) { return x.n + ' ' + fmt(x.r, 0) + '%'; }).join(', ') + ').');
  } else {
    richText(s3, '정답률 **' + TH.correctRate + '% 미만 학생은 없습니다**.');
  }
  body.appendChild(s3);
  p.appendChild(cardBox('🩺 학급 진단', '자동 요약', [body], 'diag'));
}

  p.appendChild(statsRow([

    { label: '재시도 ' + TH.retry + '회 이상', value: String(retry), unit: '문항',

  var keys = AREAS.filter(function (a) { return mineByArea[a] || allByArea[a]; })
                  .concat(Object.keys(allByArea).filter(function (k) { return AREAS.indexOf(k) === -1; }));
  var data = keys.map(function (k) {

             value: m && m.total ? m.ok / m.total * 100 : null,

  /* 문항 목록 */

    var th = node('th'); th.setAttribute('scope', 'col');
    var sp = node('div', 'th-plain', h);
    th.appendChild(sp); tr.appendChild(th);
  });
  thead.appendChild(tr); table.appendChild(thead);

  var tb = node('tbody');
  mine.slice().sort(function (a, b) {
    var x = (toNum(a['차시번호']) || 0) - (toNum(b['차시번호']) || 0);
    if (x !== 0) { return x; }

  }).forEach(function (r) {
    var c = isCorrect(r['정답여부']);
    var trr = node('tr');
    if (c === false) { trr.className = 'low'; }
    trr.appendChild(node('td', null, (r['차시번호'] ? r['차시번호'] + '. ' : '') + (r['차시명'] || '')));

    var body = node('div');

    richText(b1, me.name + ' 학생의 위험도 합계는 **' + me.score + '점**으로 판정은 **' + me.grade.label + '**입니다.');
    body.appendChild(b1);
    var b2 = node('p');
    if (me.tags.length) {
      richText(b2, '걸린 조건: **' + me.tags.map(function (t) { return t.t; }).join(', ') + '**');
    } else {
      richText(b2, '위험 신호로 잡힌 조건이 **없습니다**.');
    }
    body.appendChild(b2);
    var b3 = node('p', 'screen-only', '왼쪽 메뉴에서 성취도평가·형성평가 화면으로 넘어가면 이 학생의 자세한 그래프를 볼 수 있습니다.');
    body.appendChild(b3);
    p.appendChild(cardBox('🩺 ' + me.name + ' 학생 종합 진단', '자동 요약', [body], 'diag'));
    return;
  }

  /* --- 학급 전체 : 요약 카드 --- */
  var cnt = { 집중지원: 0, 지원필요: 0, 관찰: 0, 양호: 0 };
  risks.forEach(function (r) { cnt[r.grade.label]++; });
  p.appendChild(statsRow([
    { label: '집중지원', value: String(cnt['집중지원']), unit: '명', danger: cnt['집중지원'] > 0, sub: '위험도 4점 이상' },
    { label: '지원필요', value: String(cnt['지원필요']), unit: '명', sub: '위험도 2~3점' },
    { label: '관찰', value: String(cnt['관찰']), unit: '명', sub: '위험도 1점' },
    { label: '양호', value: String(cnt['양호']), unit: '명', sub: '위험도 0점' }
  ]));

  /* --- 표 --- */
  var box = node('div', 'table-box');
  var table = node('table');
  var thead = node('thead'), tr = node('tr');
  ['학생명', '성취수준', '평균 점수', '형성평가 정답률', '위험도', '특이사항'].forEach(function (h) {
    var th = node('th'); th.setAttribute('scope', 'col');
    th.appendChild(node('div', 'th-plain', h));
    tr.appendChild(th);
  });
  thead.appendChild(tr); table.appendChild(thead);

  var tb = node('tbody');
  risks.forEach(function (r) {
    var trr = node('tr', 'clickable');
    trr.tabIndex = 0;
    trr.setAttribute('role', 'button');
    trr.setAttribute('aria-label', r.name + ' 학생 개인별 화면 보기');
    if (isLow(r.level)) { trr.classList.add('low'); }

    trr.appendChild(node('td', null, r.name));

    var td1 = node('td');
    td1.appendChild(node('span', 'lv', r.level || '-'));
    trr.appendChild(td1);

    trr.appendChild(node('td', null, fmt(r.avg, 1)));
    trr.appendChild(node('td', null, r.rate === null ? '-' : fmt(r.rate, 1) + '%'));

    var td2 = node('td');
    var badge = node('span', 'badge ' + r.grade.cls);
    badge.appendChild(node('span', 'dot'));
    badge.appendChild(document.createTextNode(r.grade.label + ' ' + r.score + '점'));
    td2.appendChild(badge);
    trr.appendChild(td2);

    var td3 = node('td');
    var tg = node('div', 'tags');
    if (r.tags.length) {
      r.tags.forEach(function (t) { tg.appendChild(node('span', 'tag t-' + t.k, t.t)); });
    } else {
      tg.appendChild(node('span', 'tag t-ok', '특이사항 없음'));
    }
    td3.appendChild(tg);
    trr.appendChild(td3);

    var go = function () {
      state.mode = 'student';
      state.student = r.name;
      state.tab = state.data.achieve.length ? 'achieve' : 'formative';
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    trr.addEventListener('click', go);
    trr.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
    });

    tb.appendChild(trr);
  });
  table.appendChild(tb); box.appendChild(table);

  var foot = node('p', 'table-foot');
  var rules = ['성취수준 D·E +3점', '형성평가 정답률 ' + TH.correctRate + '% 미만 +2점',
               '과제제출률 ' + TH.submitRate + '% 미만 +1점'];
  EXTRA_SPECS.forEach(function (s) {
    if (s.risk && (state.data[s.key] || []).length) { rules.push(s.risk.desc + ' +' + s.risk.points + '점'); }
  });
  foot.textContent = '위험도 계산 : ' + rules.join(' / ') +
    ' · 4점 이상 집중지원, 2점 이상 지원필요, 1점 관찰, 0점 양호 · ' +
    '성취도평가는 학생별 가장 최근 회차를 사용합니다 · 행을 클릭하면 그 학생의 개인별 화면으로 이동합니다';
  p.appendChild(cardBox('학생별 종합 진단', '위험도가 높은 학생이 위로 정렬됩니다', [box, foot]));

  /* --- 안내 --- */
  if (!state.data.formative.length || !state.data.achieve.length) {
    var warn = node('div');
    var w = node('p');
    richText(w, !state.data.formative.length
      ? '형성평가 CSV를 올리지 않아 **정답률 조건(+2점)** 은 계산하지 않았습니다.'
      : '성취도평가 CSV를 올리지 않아 **성취수준(+3점)·과제제출률(+1점) 조건**은 계산하지 않았습니다.');
    warn.appendChild(w);
    p.appendChild(cardBox('🩺 참고', null, [warn], 'diag'));
  }
}

/* ====================== 13. 파일 목록 / 인식된 데이터 ====================== */
var KIND_NAME = {};   // 탭 이름 → 데이터 이름 (setupTabs 에서 채웁니다)

function renderKinds() {
  kindsEl.innerHTML = '';
  var missing = [];
  DATA_KINDS.forEach(function (k) {
    var rowsN = (state.data[k] || []).length;
    if (!rowsN) { missing.push(KIND_NAME[k]); return; }
    var filesN = state.files.filter(function (f) { return f.kind === k; }).length;
    var chip = node('span', 'kind-chip');
    chip.appendChild(node('span', 'ok', '✔'));
    chip.appendChild(document.createTextNode(KIND_NAME[k]));
    chip.appendChild(node('span', 'n', '(' + rowsN + '행' + (filesN > 1 ? ' · 파일 ' + filesN + '개' : '') + ')'));
    kindsEl.appendChild(chip);
  });
  if (missing.length) {
    var chip2 = node('span', 'kind-chip');
    chip2.style.color = 'var(--muted)';
    chip2.style.background = '#f7f9fc';
    chip2.style.borderColor = 'var(--line)';
    chip2.appendChild(document.createTextNode('○ 아직 없음: ' + missing.join(', ')));
    kindsEl.appendChild(chip2);
  }
}

/* 아직 다루지 않는 형식 : 파일 이름과 첫 줄(열 이름)을 보여 줍니다. */
function renderUnknown() {
  var box = $('unknownBox');
  box.innerHTML = '';
  if (!state.unknown.length) { box.hidden = true; return; }
  box.hidden = false;

  box.appendChild(node('p', 'u-head', '❓ 아직 다루지 않는 형식 ' + state.unknown.length + '개 — 아래 열 이름을 알려 주시면 화면을 추가할 수 있습니다'));

  var ul = node('ul');
  state.unknown.forEach(function (u, i) {
    var li = node('li');
    var top = node('div');
    top.appendChild(node('span', 'u-name', u.name));
    top.appendChild(node('span', 'u-n', '  ' + u.count + '행 · 열 ' + u.header.length + '개'));
    var x = node('button', 'btn-x', '×');
    x.type = 'button';

    x.title = '목록에서 지우기';

  box.appendChild(node('p', 'u-foot',

}

function renderFiles() {
  fileListEl.innerHTML = '';
  state.files.forEach(function (f, i) {
    var li = node('li');
    li.appendChild(document.createTextNode('📄'));
    li.appendChild(node('span', 'fname', f.name));
    li.appendChild(node('span', 'fmeta', KIND_NAME[f.kind] + ' · ' + f.rows.length + '행 · ' + formatSize(f.size)));
    var x = node('button', 'btn-x', '×');
    x.type = 'button';
    x.title = '이 파일 지우기';
    x.setAttribute('aria-label', f.name + ' 지우기');
    x.addEventListener('click', function () { state.files.splice(i, 1); state.messages = []; rebuild(); });
    li.appendChild(x);
    fileListEl.appendChild(li);
  });
  if (state.files.length) {
    var li2 = node('li');
    li2.style.border = 'none';
    li2.style.background = 'transparent';
    li2.style.padding = '4px 0 0';
    var clr = node('button', 'btn-ghost', '전체 지우기');
    clr.type = 'button';
    clr.addEventListener('click', function () {
      state.files = []; state.unknown = []; state.messages = []; state.student = ''; state.round = '';
      rebuild();
    });
    li2.appendChild(clr);
    fileListEl.appendChild(li2);
  }
}
function formatSize(b) {
  if (!b) { return ''; }
  if (b < 1024) { return b + ' B'; }
  if (b < 1048576) { return (b / 1024).toFixed(1) + ' KB'; }
  return (b / 1048576).toFixed(1) + ' MB';
}
function showNotice() {
  if (!state.messages.length) { noticeEl.hidden = true; noticeEl.textContent = ''; return; }
  noticeEl.textContent = state.messages.join(' / ');
  noticeEl.className = 'notice' + (!state.data.achieve.length && !state.data.formative.length ? ' error' : '');
  noticeEl.hidden = false;
}

/* ====================== 14. 탭 · 모드 · 전체 그리기 ====================== */
modeToggle.addEventListener('click', function (e) {
  var b = e.target.closest('button[data-mode]');
  if (!b) { return; }
  state.mode = b.getAttribute('data-mode');
  if (state.mode === 'student' && !state.student) {
    var names = studentNames();
    state.student = names.length ? names[0] : '';

  renderAll();
});

/* ============================================================================
   인쇄 : 지금 화면만 / 모든 화면
   브라우저의 인쇄 창을 그대로 사용합니다. (‘PDF로 저장’도 그 창에서 고릅니다)
   ============================================================================ */
function openPrintMenu(open) {
  printMenu.hidden = !open;
  printBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

printBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  openPrintMenu(printMenu.hidden);
});

document.addEventListener('click', function (e) {
  if (!printMenu.hidden && !printMenu.contains(e.target) && e.target !== printBtn) { openPrintMenu(false); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { openPrintMenu(false); }
});

printMenu.addEventListener('click', function (e) {
  var b = e.target.closest('button[data-print]');
  if (!b) { return; }
  openPrintMenu(false);
  doPrint(b.getAttribute('data-print'));
});

/* 인쇄 머리글 문구 만들기 */
function setPrintHead(all) {
  var names = studentNames();
  var who = (state.mode === 'student')
    ? (state.student ? state.student + ' 학생' : '개인별')
    : '학급 전체 ' + names.length + '명';
  var what = all
    ? ((state.mode === 'student' && state.student) ? '개인 전체 리포트' : '전체 화면 리포트')
    : TAB_TITLE[state.tab];
  var d = new Date();
  var date = d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.';
  var files = state.files.length ? ' · 자료 ' + state.files.length + '개' : '';
  printSub.textContent = what + ' · ' + who + files + ' · ' + date + ' 인쇄';
}

/* 모든 탭을 한 번에 그려 둡니다 (데이터가 있는 것만) */
function renderEveryPanel() {
  renderOverall();
  if (state.data.achieve.length) { renderAchieve(); }
  if (state.data.formative.length) { renderFormative(); }
  EXTRA_SPECS.forEach(function (s) {
    if ((state.data[s.key] || []).length) { renderSpec(panels[s.key], s); }
  });
}

/* 그 학생에게 기록이 있는 데이터인지 */
function hasRowsFor(kind) {
  var rows = state.data[kind] || [];
  if (!rows.length) { return false; }
  if (state.mode !== 'student') { return true; }
  return rows.some(function (r) { return r['학생명'] === state.student; });
}

function doPrint(mode) {
  document.body.classList.toggle('print-nodict', !$('printDict').checked);
  if (mode === 'all') {
    renderEveryPanel();
    TABS.forEach(function (t) {
      panelSections[t.key].hidden = (t.key === 'overall') ? false : !hasRowsFor(t.key);
    });
    document.body.classList.add('print-all');
  }
  setPrintHead(mode === 'all');
  window.print();
}

/* 인쇄 창을 닫으면 화면을 원래대로 */
window.addEventListener('afterprint', function () {
  document.body.classList.remove('print-nodict');
  if (document.body.classList.contains('print-all')) {
    document.body.classList.remove('print-all');
    renderAll();
  }
});

fileBtn.addEventListener('click', function () {
  state.showUpload = !state.showUpload;
  renderAll();
  if (state.showUpload) { window.scrollTo({ top: 0, behavior: 'smooth' }); }
});

uploadClose.addEventListener('click', function () {
  state.showUpload = false;
  renderAll();
});

studentSelect.addEventListener('change', function () {
  state.student = studentSelect.value;
  renderAll();
});

function rebuild() {
  DATA_KINDS.forEach(function (k) { state.data[k] = []; });
  state.files.forEach(function (f) {
    if (state.data[f.kind]) { state.data[f.kind] = state.data[f.kind].concat(f.rows); }
  });
  var names = studentNames();
  if (state.student && names.indexOf(state.student) === -1) { state.student = ''; }
  if (state.mode === 'student' && !state.student) { state.student = names.length ? names[0] : ''; }
  showNotice();
  renderKinds();
  renderFiles();
  renderUnknown();
  renderAll();
}

function renderAll() {
  /* 사이드바 메뉴 */
  Array.prototype.forEach.call(menuEl.querySelectorAll('button[data-tab]'), function (b) {
    var on = b.getAttribute('data-tab') === state.tab;
    b.classList.toggle('active', on);
    b.setAttribute('aria-current', on ? 'page' : 'false');
  });
  var allNames = studentNames();
  Array.prototype.forEach.call(menuEl.querySelectorAll('button[data-tab]'), function (b) {
    var tag = b.querySelector('.tag');
    if (!tag) { return; }
    var k = b.getAttribute('data-tab');
    if (k === 'overall') { tag.textContent = allNames.length ? allNames.length + '명' : ''; }
    else { tag.textContent = (state.data[k] || []).length ? (state.data[k] || []).length + '행' : ''; }
  });

  /* 위쪽 제목과 토글 */
  pageTitle.textContent = TAB_TITLE[state.tab];
  var names = studentNames();
  pageSub.textContent = (!names.length) ? 'CSV 파일을 올려 주세요'
    : (state.mode === 'student' ? (state.student ? state.student + ' 학생 한 명만 보고 있습니다' : '학생을 골라 주세요')
                               : '학급 전체 ' + names.length + '명을 보고 있습니다');

  Array.prototype.forEach.call(modeToggle.querySelectorAll('button[data-mode]'), function (b) {
    b.classList.toggle('active', b.getAttribute('data-mode') === state.mode);
  });

  studentSelect.hidden = (state.mode !== 'student');
  if (state.mode === 'student') {
    studentSelect.innerHTML = '';
    if (!names.length) {
      var o = node('option', null, '학생 없음'); o.value = ''; studentSelect.appendChild(o);
    } else {
      names.forEach(function (n) {
        var o = node('option', null, n + ' 학생'); o.value = n; studentSelect.appendChild(o);
      });
      if (!state.student) { state.student = names[0]; }
      studentSelect.value = state.student;
    }
  }

  /* 인쇄 메뉴 문구 (개인별인지에 따라 달라집니다) */
  var kindsWithData = DATA_KINDS.filter(function (k) { return hasRowsFor(k); }).length;
  $('printOneSub').textContent = TAB_TITLE[state.tab] + ' 화면 그대로';
  if (state.mode === 'student' && state.student) {
    $('printAllTitle').textContent = state.student + ' 학생 전체 리포트';
    $('printAllSub').textContent = '이 학생 기록이 있는 데이터 ' + kindsWithData + '종을 이어서';
  } else {
    $('printAllTitle').textContent = '모든 화면 인쇄';
    $('printAllSub').textContent = '데이터 ' + kindsWithData + '종을 쪽을 나눠 이어서';
  }
  setPrintHead(false);

  /* 업로드 상자 : 데이터가 없으면 항상 보이고, 있으면 접습니다 */
  var fileCount = state.files.length;
  var hasData = DATA_KINDS.some(function (k) { return (state.data[k] || []).length; });
  var showUp = state.showUpload || !hasData;
  uploadCard.hidden = !showUp;
  uploadFoot.hidden = !hasData;
  fileBtn.setAttribute('aria-expanded', showUp ? 'true' : 'false');
  fileBtnN.textContent = fileCount ? String(fileCount) : '';
  fileBtn.title = fileCount ? '올린 파일 ' + fileCount + '개 · 눌러서 열기/닫기' : 'CSV 파일 올리기';

  /* 화면 3개 중 현재 것만 보이기 */
  Object.keys(panelSections).forEach(function (k) { panelSections[k].hidden = (k !== state.tab); });

  if (state.tab === 'overall') { renderOverall(); }
  else if (state.tab === 'achieve') { renderAchieve(); }
  else if (state.tab === 'formative') { renderFormative(); }
  else if (state.tab === 'sesta') { renderSesta(); }
  else { renderSpec(panels[state.tab], SPEC_BY_KEY[state.tab]); }
}

/* ============================================================================
   15. 데이터 종류별 화면 정의 (협업활동 · 교사 관찰기록 · 정의적 영역 설문 ·
       포트폴리오 · AI도구 활용로그 · LMS 학습로그)

   여섯 가지 데이터는 생김새가 서로 달라도 화면 구조는 같습니다.
     카드 → 그래프 → 학생별 표 → 학급 진단 → 데이터 항목 설명
   그래서 “무엇을 계산해 어떤 그래프로 그릴지”만 아래에 적어 두고,
   실제 그리는 일은 renderSpec() 한 곳에서 공통으로 처리합니다.
   ============================================================================ */

/* ---------- 집계 도우미 ---------- */
function colNums(rows, c) { return rows.map(function (r) { return toNum(r[c]); }); }
function meanCol(rows, c) { return mean(colNums(rows, c)); }
function sumCol(rows, c) {
  return colNums(rows, c).reduce(function (a, b) { return a + (b || 0); }, 0);
}
function countBy(rows, c) {
  var m = {};
  rows.forEach(function (r) {
    var k = String(r[c] === undefined ? '' : r[c]).trim();
    if (!k) { return; }
    m[k] = (m[k] || 0) + 1;
  });
  return m;
}
function countBySplit(rows, c) {   // 한 칸에 여러 값이 세미콜론으로 들어있는 경우
  var m = {};
  rows.forEach(function (r) {
    String(r[c] === undefined ? '' : r[c]).split(/[;,]/).forEach(function (t) {
      var k = t.trim();
      if (!k || k === '-' || k === '없음') { return; }
      m[k] = (m[k] || 0) + 1;
    });
  });
  return m;
}
function items(mapObj, sortDesc) {
  var out = Object.keys(mapObj).map(function (k) { return { label: k, value: mapObj[k] }; });
  if (sortDesc !== false) { out.sort(function (a, b) { return b.value - a.value; }); }
  return out;
}
function keysSorted(rows, c, numeric) {
  var out = [];
  rows.forEach(function (r) {
    var v = String(r[c] === undefined ? '' : r[c]).trim();
    if (v && out.indexOf(v) === -1) { out.push(v); }
  });
  out.sort(function (a, b) {
    if (numeric) {
      var x = toNum(a), y = toNum(b);
      if (x !== null && y !== null) { return x - y; }
    }
    return a.localeCompare(b, 'ko');
  });
  return out;
}
function meanByKey(rows, keyCol, valCol, numericKey) {

/* 눈금 최대값을 보기 좋게 올림 */
